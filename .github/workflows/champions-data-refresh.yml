name: Champions data refresh

on:
  schedule:
    - cron: '0 8 * * 1'   # weekly, Mondays 08:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape pokebase.app
        shell: pwsh
        run: ./champions-data-raw/scrape-pokebase.ps1

      - name: Commit changes
        run: |
          if git diff --quiet -- champions-data-raw/pokebase-dex.json champions-data-raw/pokebase-dex.data.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions-data-raw/pokebase-dex.json champions-data-raw/pokebase-dex.data.js
          git commit -m "Champions data refresh"
          git push
