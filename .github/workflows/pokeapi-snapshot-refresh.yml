name: PokeAPI snapshot refresh

on:
  schedule:
    - cron: '0 9 * * 1'   # weekly, Mondays 09:00 UTC (an hour after the Champions refresh)
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snapshot from PokeAPI's source tables
        shell: pwsh
        run: ./scripts/build-snapshot.ps1

      - name: Commit if the data actually changed
        run: |
          git add data
          # ignore the generatedAt stamp so an unchanged dataset doesn't produce a weekly commit
          if [ -z "$(git diff --cached -U0 -- data | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'generatedAt')" ]; then
            echo "No data changes."
            git reset -q
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PokeAPI snapshot refresh"
          git pull --rebase
          git push
